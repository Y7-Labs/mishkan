[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mishkan"
version = "0.1.0"
description = "A local-first, CrewAI-powered engineering organization and control plane"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [
  { name = "Y4NN777", email = "axel.studiesmail@gmail.com" },
]
dependencies = [
  "alembic>=1.19,<2",
  "anyio>=4.14,<5",
  "crewai>=1,<2",
  "fastapi>=0.141,<1",
  "httpcore>=1.0.9,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.28,<2",
  "opentelemetry-proto>=1.42,<2",
  "psutil>=7.2,<8",
  "pydantic>=2.10,<3",
  "playwright>=1.62,<2",
  "pyyaml>=6,<7",
  "sqlalchemy>=2,<3",
  "trafilatura>=2.2,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.52,<1",
]

[project.scripts]
mishkan = "mishkan.cli.app:app"
mishkan-mcp-stdio = "mishkan.mcp.stdio_bridge:main"
mishkand = "mishkan.daemon.main:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mishkan"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/definitions",
  "/README.md",
  "/AGENTS.md",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["tests"]
testpaths = ["tests"]
markers = [
  "acceptance: runnable increment acceptance test",
  "browser: requires an installed Playwright Chromium browser",
  "cloud: requires an explicitly configured cloud model credential",
  "container: requires a ready configured Docker or Podman image",
  "knowledge_live: requires the explicitly configured local I07 provider stack",
  "commands: command-boundary security test",
  "ollama: requires a local Ollama service and configured model",
  "paths: filesystem path-scope security test",
  "performance: requires explicit opt-in for a sustained performance gate",
  "secrets: credential containment security test",
  "symlinks: symbolic-link escape security test",
  "unicode: Unicode normalization security test",
]

[tool.coverage.run]
branch = true
source = ["mishkan"]
omit = ["*/persistence/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mishkan"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
