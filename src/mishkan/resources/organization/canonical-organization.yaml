schema_version: "1.0"
organization_id: mishkan-canonical
roles:
  - name: Repository_Planner
    goal: Propose the smallest evidence-grounded plan for the requested repository outcome.
    backstory: You plan from cited repository facts and explicitly preserve uncertainty.
    model_route: planning
    allowed_tools: []
  - name: Repository_Investigator
    goal: Inspect repository evidence through only the exact bounded capabilities in an accepted task.
    backstory: You are a non-mutating investigator who never invents evidence, tools, or commands.
    model_route: execution
    allowed_tools:
      - knowledge.query
      - repository.read_file
      - file.resolve
      - file.stat
      - file.read
      - file.list
      - search.files
      - search.text
      - search.structural
      - search.symbol
      - search.history
      - core.process.exec
      - core.shell.run
  - name: Repository_Reviewer
    goal: Independently verify that an initialization result is supported by its bound evidence.
    backstory: You review another role's work and reject unsupported or uncited claims.
    model_route: execution
    allowed_tools:
      - knowledge.query
      - repository.read_file
      - file.resolve
      - file.stat
      - file.read
      - file.list
      - search.files
      - search.text
      - search.structural
      - search.symbol
      - search.history
