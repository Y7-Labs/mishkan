schema_version: "1.0"
source_id: bundled.local
revision: "30"
adoption_authority: MISHKAN release
priority: 0
rules:
  - rule_id: local.repository-read
    priority: 100
    decision: allow
    scope:
      identities: ["role:Repository_Investigator", "role:Repository_Reviewer"]
      objective_classes: [repository-initialization]
      repositories: ["*"]
      outcomes: [mishkan.init]
      roles: [Repository_Investigator, Repository_Reviewer]
      capabilities:
        - repository.read_file
        - file.resolve
        - file.stat
        - file.read
        - file.list
        - search.files
        - search.text
        - search.structural
        - search.symbol
        - search.history
      effect_classes: [read]
      paths: ["*"]
      executables: ["*"]
      arguments: ["*"]
      network_destinations: ["*"]
      remotes: ["*"]
      branches: ["*"]
      environments: ["*"]
      credentials: ["*"]
      external_resources: ["*"]
      isolation_profiles: ["*"]
      max_timeout_seconds: 120
      max_memory_mb: 512
      allow_network: false
      max_concurrency: 2
  - rule_id: local.repository-probe.git-read
    priority: 110
    decision: allow
    scope:
      identities: ["role:Repository_Investigator"]
      objective_classes: [repository-initialization]
      repositories: ["*"]
      outcomes: [mishkan.init]
      roles: [Repository_Investigator]
      capabilities: [core.process.exec]
      effect_classes: [command]
      paths: ["*"]
      executables:
        - /usr/bin/git
        - /usr/local/bin/git
        - /usr/local/Cellar/git/*/bin/git
        - /opt/homebrew/bin/git
        - /opt/homebrew/Cellar/git/*/bin/git
        - /Applications/Xcode*.app/Contents/Developer/usr/bin/git
        - /Library/Developer/CommandLineTools/usr/bin/git
      arguments: [show, "HEAD:*"]
      network_destinations: ["*"]
      remotes: ["*"]
      branches: ["*"]
      environments: ["*"]
      credentials: ["*"]
      external_resources: ["*"]
      isolation_profiles: ["*"]
      max_timeout_seconds: 30
      max_memory_mb: 512
      allow_network: true
      max_concurrency: 1
  - rule_id: local.repository-knowledge
    priority: 105
    decision: allow
    scope:
      identities: ["role:Repository_Investigator", "role:Repository_Reviewer"]
      objective_classes: [repository-initialization]
      repositories: ["*"]
      outcomes: [mishkan.init]
      roles: [Repository_Investigator, Repository_Reviewer]
      capabilities: [knowledge.query]
      effect_classes: [read]
      effects: ["*"]
      paths: ["*"]
      executables: ["*"]
      arguments: ["*"]
      network_destinations: ["*"]
      remotes: ["*"]
      branches: ["*"]
      environments: ["*"]
      credentials: ["*"]
      external_resources: ["*"]
      isolation_profiles: ["*"]
      max_timeout_seconds: 3600
      max_memory_mb: 512
      allow_network: true
      max_concurrency: 8
  - rule_id: local.repository-probe.approval
    priority: 100
    decision: require_approval
    scope:
      identities: ["role:Repository_Investigator"]
      objective_classes: [repository-initialization]
      repositories: ["*"]
      outcomes: [mishkan.init]
      roles: [Repository_Investigator]
      capabilities: [core.process.exec, core.shell.run]
      effect_classes: [command]
      paths: ["*"]
      executables: ["*"]
      arguments: ["*"]
      network_destinations: ["*"]
      remotes: ["*"]
      branches: ["*"]
      environments: ["*"]
      credentials: ["*"]
      external_resources: ["*"]
      isolation_profiles: ["*"]
      max_timeout_seconds: 30
      max_memory_mb: 512
      allow_network: true
      max_concurrency: 1
  - rule_id: local.application-commands
    priority: 50
    decision: allow
    scope:
      identities: ["*"]
      objective_classes: [application-command]
      repositories: ["*"]
      outcomes:
        - system.checkpoint
        - run.initialize
        - run.prospective.create
        - run.repository.establish
        - run.cancel
        - run.recover
        - artifact.upload.open
        - artifact.upload.chunk
        - artifact.upload.commit
        - artifact.reference.update
        - artifact.collection.create
        - artifact.hold.set
        - artifact.hold.release
        - artifact.pin.set
        - artifact.pin.release
        - artifact.gc.plan
        - artifact.gc.apply
        - artifact.reconcile.plan
        - artifact.reconcile.apply
        - event.hold.create
        - event.hold.release
        - event.retention.plan
        - event.retention.apply
        - change.plan
        - change.apply
        - change.reconcile
        - session.start
        - session.write
        - session.resize
        - session.signal
        - session.cancel
        - session.settle
        - mcp.connection.connect
        - mcp.call.cancel
        - mcp.call.reconcile
        - knowledge.query
        - knowledge.ingest
        - knowledge.refresh
        - knowledge.operation.cancel
        - knowledge.operation.reconcile
        - knowledge.memory.capture
        - knowledge.promotion.propose
        - knowledge.promotion.decide
        - registry.entry.add
        - registry.entry.enable
        - registry.entry.disable
        - registry.entry.update
        - registry.entry.remove
        - registry.entry.set_precedence
        - skill.version.register
        - skill.version.decide
        - skill.version.archive
        - skill.version.delete
        - skill.version.restore
        - skill.version.reset
        - skill.version.pin
        - skill.version.unpin
        - skill.usage.record
        - skill.invoke
        - skill.learn
        - environment.observe
        - environment.resolve
        - environment.descriptor.validate
        - environment.descriptor.change.plan
        - environment.operation.plan
        - environment.command.plan
        - environment.attempt.settle
        - environment.verification.record
        - environment.binding.invalidate
        - telemetry.evaluation.import
        - context.recommend
        - mission.create
        - mission.brief.record
        - mission.crew.record
        - conversation.create
        - conversation.message.post
        - mission.decision.record
        - mission.escalation.open
        - mission.intervention.apply
        - mission.assignment.record
        - mission.run-binding.record
        - mission.run-report.record
        - mission.task.claim
        - mission.transition
        - mission.governance.propose
        - mission.environment.propose
        - mission.environment.accept
        - mission.environment.resolve
        - organization.evidence.record
        - organization.promotion.decide
      roles: [application-client]
      capabilities:
        - application.system.checkpoint
        - application.run.initialize
        - application.run.context
        - application.run.control
        - application.artifact.upload
        - application.artifact.reference
        - application.artifact.collection
        - application.artifact.retention
        - application.artifact.gc
        - application.artifact.reconcile
        - application.event.hold
        - application.event.retention
        - application.change.plan
        - application.change.apply
        - application.change.reconcile
        - application.session.start
        - application.session.io
        - application.session.control
        - application.session.settle
        - application.mcp.connect
        - application.mcp.control
        - application.knowledge.query
        - application.knowledge.mutate
        - application.knowledge.promotion
        - application.registry.lifecycle
        - application.skill.lifecycle
        - application.skill.usage
        - application.skill.invoke
        - application.skill.learn
        - application.environment.observe
        - application.environment.resolve
        - application.environment.descriptor
        - application.environment.operation
        - application.environment.command
        - application.environment.attempt
        - application.environment.verification
        - application.environment.invalidate
        - application.telemetry.evaluation
        - application.context.recommend
        - application.mission.lifecycle
        - application.mission.brief
        - application.mission.crew
        - application.mission.environment
        - application.organization.evolution
        - application.conversation.lifecycle
        - application.conversation.message
        - application.mission.decision
        - application.mission.escalation
        - application.mission.intervention
        - application.mission.assignment
        - application.mission.run-binding
        - application.mission.reporting
        - application.mission.task
        - application.mission.governance
      effect_classes: [read, control, coordination, artifact, filesystem, process, external, registry_lifecycle, skill_lifecycle]
      effects: ["*"]
      paths: ["*"]
      executables: ["*"]
      arguments: ["*"]
      network_destinations: ["*"]
      remotes: ["*"]
      branches: ["*"]
      environments: ["*"]
      credentials: ["*"]
      external_resources: ["*"]
      isolation_profiles: ["*"]
