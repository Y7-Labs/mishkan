schema_version: "1.6"
mode: hybrid
engineering_profile: package://mishkan.resources.environment/default.yaml
engineering_pack_sources:
  - package://mishkan.resources.environment/technical-packs.yaml
notifications:
  default_severity: information
  default_delivery: feed
  page_limit: 100
  rules:
    - rule_id: mission-escalation
      event_types: [mission.escalation_opened]
      sources: [mishkan.conversations]
      severity: urgent
      delivery: feed
    - rule_id: mission-action-required
      event_types: [mission.environment_binding_incompatible, mission.environment_binding_unresolved]
      severity: action_required
      delivery: feed
    - rule_id: mission-attention
      event_types: [mission.*, organization.professional_promotion_rejected]
      severity: attention
      delivery: feed
    - rule_id: routine-telemetry
      event_types: [telemetry.*]
      severity: information
      delivery: silent
telemetry:
  disclosure: "off"
  metadata_attributes:
    - mishkan.command.id
    - mishkan.command.type
    - mishkan.actor.id
    - mishkan.target.type
    - mishkan.result.status
    - mishkan.result.revision
    - mishkan.event.cursor
  include_command_payload: false
  include_result_payload: false
  max_attributes: 64
  max_attribute_bytes: 4096
timezone: UTC
project:
  workspace: .
providers:
  ollama-local:
    kind: ollama
    endpoint: http://127.0.0.1:11434
    probe_url: http://127.0.0.1:11434/api/tags
  cloud-fallback:
    kind: anthropic
    endpoint: https://api.anthropic.com
    credential_pool:
      - source: env
        locator: ANTHROPIC_API_KEY
model_routes:
  planning:
    candidates:
      - provider: ollama-local
        model: qwen2.5-coder:7b
      - provider: cloud-fallback
        model: claude-sonnet-4-5
  execution:
    candidates:
      - provider: ollama-local
        model: qwen2.5-coder:7b
      - provider: cloud-fallback
        model: claude-sonnet-4-5
agent_routes: {}
services: {}
policy_sources:
  - package://mishkan.resources.policies/local-control-plane.yaml
tool_sources:
  - package://mishkan.resources.tools/core-catalog.yaml
inspection_profile: package://mishkan.resources.inspection/default-security.yaml
isolation_profiles:
  - package://mishkan.resources.isolation/local-no-network.yaml
daemon:
  host: 127.0.0.1
  port: 8888
  token_file: .mishkan/runtime/api-token.json
  heartbeat_seconds: 15
  event_poll_seconds: 0.25
  event_page_limit: 100
  request_timeout_seconds: 120
  max_request_bytes: 8388608
persistence:
  database: .mishkan/mishkan.db
  busy_timeout_ms: 5000
  event_retention_days: 30
artifacts:
  root: .mishkan/artifacts
  max_artifact_bytes: 536870912
  chunk_bytes: 1048576
  staging_ttl_seconds: 86400
sessions:
  spool_root: .mishkan/sessions
  default_profile: standard
  profiles:
    standard:
      cancellation_signals: [TERM, INT, KILL]
      grace_seconds: 2.0
      settle_timeout_seconds: 30.0
      max_output_bytes: 536870912
      max_input_bytes: 1048576
      preview_bytes: 4096
      read_chunk_bytes: 65536
      readiness_poll_seconds: 0.1
      effect_observation:
        max_entries: 100000
        max_file_bytes: 16777216
        max_total_bytes: 268435456
        exclude: [.git/**, .mishkan/**]
web:
  network_profiles:
    public-read:
      allowed_schemes: [http, https]
      allowed_ports: [80, 443]
      allow_public: true
      allow_private: false
      allow_loopback: false
      allow_link_local: false
      allow_multicast: false
      max_redirects: 8
      connect_timeout_seconds: 10.0
      read_timeout_seconds: 30.0
      max_response_bytes: 16777216
      max_decompressed_bytes: 67108864
      max_concurrency: 8
      credential_header_names: [authorization, cookie, proxy-authorization, x-api-key, x-subscription-token]
    local-services:
      allowed_schemes: [http, https]
      allowed_ports: [7776, 7777, 7778, 8080, 8888, 11434]
      allow_public: false
      allow_private: false
      allow_loopback: true
      allow_link_local: false
      allow_multicast: false
      max_redirects: 2
      connect_timeout_seconds: 5.0
      read_timeout_seconds: 30.0
      max_response_bytes: 16777216
      max_decompressed_bytes: 67108864
      max_concurrency: 8
      credential_header_names: [authorization, cookie, proxy-authorization, x-api-key, x-subscription-token]
  sources:
    searxng-local:
      role: broker
      adapter: searxng.search
      endpoint: http://127.0.0.1:8080/search
      network_profile: local-services
      max_results: 20
    brave-direct:
      role: direct_source
      adapter: brave.search
      endpoint: https://api.search.brave.com/res/v1/web/search
      network_profile: public-read
      credential_refs:
        - source: env
          locator: BRAVE_SEARCH_API_KEY
      reported_upstreams: [brave]
      max_results: 20
  extractors:
    trafilatura:
      role: extractor
      adapter: trafilatura.extract
      max_input_bytes: 16777216
      output_format: markdown
  crawlers:
    bounded-http:
      role: crawler
      adapter: native.web.crawl
      network_profile: public-read
      max_depth: 3
      max_pages: 100
      max_concurrency: 4
      delay_seconds: 0.25
      robots_profile: respect
      render_mode: http
  default_network_profile: public-read
  default_search_strategy: automatic
  default_search_sources: [searxng-local, brave-direct]
  default_extractor: trafilatura
  default_crawler: bounded-http
  cache_ttl_seconds: 3600
browser:
  staging_root: .mishkan/browser
  default_profile: isolated-chromium
  profiles:
    isolated-chromium:
      kind: isolated
      adapter: playwright.chromium
      engine: chromium
      network_profile: public-read
      allowed_origins: ["*"]
      sensitivity: internal
      retention: run
      headless: true
      max_pages: 8
      max_download_bytes: 16777216
      action_timeout_seconds: 30.0
      navigation_timeout_seconds: 60.0
  observation_ttl_seconds: 30.0
  max_observation_bytes: 2097152
  max_diagnostic_entries: 10000
mcp:
  connections:
    graphify-local:
      transport: streamable_http
      protocol_strategy: compatible_set
      protocol_versions: ["2025-11-25"]
      trust: local-self-hosted
      exposure_profile: graphify-read
      credential_refs:
        - source: env
          locator: MISHKAN_GRAPHIFY_API_KEY
      network_profile: local-services
      endpoint: http://127.0.0.1:7778/mcp
      headers:
        x-api-key:
          source: env
          locator: MISHKAN_GRAPHIFY_API_KEY
      enabled: true
      remote_tasks_enabled: false
      connect_timeout_seconds: 5.0
      call_timeout_seconds: 30.0
      max_result_bytes: 2097152
  exposure_profiles:
    graphify-read:
      operations: [query_graph, get_node, get_neighbors, get_community, god_nodes, graph_stats, shortest_path]
      resources: []
      prompts: []
    governed-harness:
      operations:
        - system.health
        - system.snapshot
        - events.list
        - run.get
        - organization.get
        - organization.inspect
        - organization.branch.inspect
        - organization.competence.get
        - organization.evidence.list
        - organization.promotions.list
        - mission.list
        - mission.get
        - mission.inspect
        - mission.run-reports.list
        - mission.templates.list
        - conversation.list
        - conversation.get
        - advisory.candidates.list
        - notification.list
        - knowledge.query
        - knowledge.sources.list
        - knowledge.operations.list
        - command.submit
      resources:
        - mishkan://snapshot
        - mishkan://runs
        - mishkan://events
        - mishkan://organization
        - mishkan://missions
        - mishkan://conversations
        - mishkan://advisory/candidates
        - mishkan://notifications
        - mishkan://knowledge/sources
        - mishkan://knowledge/operations
      prompts: []
  facade:
    enabled: true
    streamable_http_path: /mcp
    stdio_bridge_enabled: true
    exposure_profile: governed-harness
  progress_retention_seconds: 86400
  cancellation_poll_seconds: 0.1
  task_poll_min_seconds: 0.1
  task_poll_max_seconds: 5.0
knowledge:
  staging_root: .mishkan/knowledge
  inspection_profile: package://mishkan.resources.knowledge/default-evidence.yaml
  sources:
    literal-native:
      knowledge_class: literal
      adapter: native.literal
      disclosure_profile: repository-scoped
      cost_class: local_free
      query_timeout_seconds: 10.0
      operation_timeout_seconds: 30.0
      max_results: 100
      max_result_bytes: 16777216
      provider_schema: mishkan-literal-1
    mem0-local:
      knowledge_class: episodic
      adapter: mem0.oss
      endpoint: http://127.0.0.1:7776
      credential_refs:
        - source: env
          locator: MISHKAN_MEM0_API_KEY
      credential_header: x-api-key
      network_profile: local-services
      disclosure_profile: project-private
      cost_class: local_free
      query_timeout_seconds: 10.0
      operation_timeout_seconds: 120.0
      max_results: 50
      max_result_bytes: 2097152
      provider_schema: mem0-oss-rest-2
    cognee-local:
      knowledge_class: semantic
      adapter: cognee.oss
      endpoint: http://127.0.0.1:7777/api/v1
      credential_refs:
        - source: env
          locator: MISHKAN_COGNEE_BEARER
      credential_header: authorization
      credential_prefix: "Bearer "
      network_profile: local-services
      disclosure_profile: project-private
      cost_class: local_free
      query_timeout_seconds: 30.0
      operation_timeout_seconds: 1800.0
      max_results: 50
      max_result_bytes: 8388608
      provider_schema: cognee-rest-1
    graphify-local:
      knowledge_class: structural
      adapter: graphify.mcp
      mcp_connection: graphify-local
      disclosure_profile: repository-scoped
      cost_class: local_free
      query_timeout_seconds: 30.0
      operation_timeout_seconds: 1800.0
      max_results: 100
      max_result_bytes: 2097152
      provider_schema: graphify-mcp-1
  selection_order:
    literal: [literal-native]
    episodic: [mem0-local]
    semantic: [cognee-local]
    structural: [graphify-local]
  literal_fallback: true
  promotion_approver_identities: [CTO, CEO]
  capture_max_characters: 16384
  operation_poll_seconds: 0.25
  query_retention_days: 90
skills:
  managed_root: .mishkan/skills/active
  sources:
    - source_id: managed-active
      kind: project
      uri: project:.mishkan/skills/active
      revision: managed:pointer
      precedence: 100
      trust: trusted
      default_activation: candidate
  bounds:
    max_frontmatter_bytes: 65536
    max_manifest_bytes: 1048576
    max_resource_bytes: 16777216
    max_package_bytes: 268435456
    max_package_files: 10000
    max_resource_depth: 16
    allow_frontmatter_extensions: false
  bundles: []
  inspection_profile: package://mishkan.resources.skills/default-inspection.yaml
  automatic_selection: true
  max_automatic_skills: 8
  miss_proposal_threshold: 3
  stale_after_days: 180
  learning_max_source_bytes: 67108864
