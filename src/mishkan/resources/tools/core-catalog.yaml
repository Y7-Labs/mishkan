schema_version: "1.0"
source_id: bundled.core
source_kind: native
revision: "12"
adoption_authority: MISHKAN release
tools:
  - tool_id: knowledge.query
    version: 1.0.0
    summary: Retrieve bounded attributed evidence for one explicit knowledge class.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/knowledge-query.yaml
  - tool_id: file.resolve
    version: 1.0.0
    summary: Resolve one scoped path and report the observed filesystem object.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/file-resolve.yaml
  - tool_id: file.stat
    version: 1.0.0
    summary: Inspect bounded metadata for one resolved filesystem object.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/file-stat.yaml
  - tool_id: file.read
    version: 1.0.0
    summary: Read bounded bytes, text, ranges, or lines from one resolved regular file.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/file-read.yaml
  - tool_id: file.list
    version: 1.0.0
    summary: List one directory or bounded tree with deterministic pagination and visible omissions.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/file-list.yaml
  - tool_id: search.files
    version: 1.0.0
    summary: Find scoped filesystem objects by glob and type with bounded pagination.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/search-files.yaml
  - tool_id: search.text
    version: 1.0.0
    summary: Search scoped text with bounded literal or ripgrep-regex semantics.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/search-text.yaml
    availability: {dependencies: [rg]}
  - tool_id: search.structural
    version: 1.0.0
    summary: Search bounded Python syntax trees without claiming semantic coverage.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/search-structural.yaml
  - tool_id: search.symbol
    version: 1.0.0
    summary: Search Python definition and reference syntax with explicit non-semantic coverage.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/search-symbol.yaml
  - tool_id: search.history
    version: 1.0.0
    summary: Search bounded local Git commit history without an implicit network operation.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/search-history.yaml
    availability: {platforms: [linux, darwin], dependencies: [git]}
  - tool_id: repository.read_file
    version: 1.0.0
    summary: Read one exact repository-relative file bound to the accepted task.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/read-file.yaml
  - tool_id: core.process.exec
    version: 1.0.0
    summary: Execute one canonical executable and literal argument vector without a shell.
    effect_class: command
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/process-exec.yaml
    availability: {platforms: [linux, darwin], runtimes: [python]}
  - tool_id: core.shell.run
    version: 1.0.0
    summary: Run one Bash script under an explicit versioned shell profile.
    effect_class: command
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/shell-run.yaml
    availability: {platforms: [linux, darwin], runtimes: [python], dependencies: [bash]}
  - tool_id: command.run
    version: 1.0.0
    summary: Run an argument-vector command through an observed configured isolation profile.
    effect_class: command
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/command-run.yaml
    availability: {platforms: [linux, darwin], runtimes: [python]}
  - tool_id: git.stage
    version: 1.0.0
    summary: Stage exact repository-relative paths under policy.
    effect_class: repository_write
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/git-stage.yaml
    availability: {platforms: [linux, darwin], dependencies: [git]}
  - tool_id: git.commit
    version: 1.0.0
    summary: Commit exact staged paths with explicit identity and base evidence.
    effect_class: repository_write
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/git-commit.yaml
    availability: {platforms: [linux, darwin], dependencies: [git]}
  - tool_id: git.push
    version: 1.0.0
    summary: Push one exact branch and HEAD to a verified remote.
    effect_class: repository_remote_write
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/git-push.yaml
    availability: {platforms: [linux, darwin], dependencies: [git]}
  - tool_id: git.force_with_lease
    version: 1.0.0
    summary: Force an exact branch only while the remote lease still matches.
    effect_class: repository_remote_write
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/git-force-with-lease.yaml
    availability: {platforms: [linux, darwin], dependencies: [git]}
  - tool_id: git.force_push
    version: 1.0.0
    summary: Force an exact branch and HEAD only under explicit public policy.
    effect_class: repository_remote_write
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/git-force-push.yaml
    availability: {platforms: [linux, darwin], dependencies: [git]}
  - tool_id: web.search
    version: 1.0.0
    summary: Search through explicit configured sources with attributable routes and fallbacks.
    effect_class: network
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/web-search.yaml
  - tool_id: web.fetch
    version: 1.0.0
    summary: Retrieve one GET or HEAD resource through an explicit bounded network profile.
    effect_class: network
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/web-fetch.yaml
  - tool_id: web.request
    version: 1.0.0
    summary: Execute one explicitly governed HTTP method with declared effects and origins.
    effect_class: network
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/web-request.yaml
  - tool_id: web.extract
    version: 1.0.0
    summary: Derive attributable text from one immutable retrieved artifact.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/web-extract.yaml
  - tool_id: web.map
    version: 1.0.0
    summary: Map links within an explicit bounded origin and crawler profile.
    effect_class: network
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/web-map.yaml
  - tool_id: web.crawl
    version: 1.0.0
    summary: Crawl and extract content within explicit bounded scope and stop conditions.
    effect_class: network
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/web-crawl.yaml
  - tool_id: browser.open
    version: 1.0.0
    summary: Open one governed Browser session through an explicit configured profile.
    effect_class: network
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/browser-open.yaml
    availability: {platforms: [linux, darwin], runtimes: [python], dependencies: [playwright]}
  - tool_id: browser.observe
    version: 1.0.0
    summary: Capture a bounded observation tied to one Browser page and session revision.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/browser-observe.yaml
  - tool_id: browser.act
    version: 1.0.0
    summary: Execute an authorized resolved effect against an exact observed Browser target.
    effect_class: network
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/browser-act.yaml
  - tool_id: browser.diagnostics
    version: 1.0.0
    summary: Read bounded filtered Browser and Chrome DevTools diagnostic evidence.
    effect_class: read
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/browser-diagnostics.yaml
  - tool_id: browser.close
    version: 1.0.0
    summary: Close one governed Browser session and preserve its durable record.
    effect_class: network
    source_id: bundled.core
    source_kind: native
    contract_uri: package://mishkan.resources.tools/contracts/browser-close.yaml
toolsets:
  - toolset_id: file.readonly
    version: 1.0.0
    summary: Canonical non-mutating native file capabilities.
    tools: [file.resolve, file.stat, file.read, file.list]
  - toolset_id: repository.readonly
    version: 1.0.0
    summary: Repository inspection capabilities.
    tools: [repository.read_file]
  - toolset_id: search.basic
    version: 1.0.0
    summary: Concretely available non-mutating search capabilities.
    tools: [search.files, search.text]
  - toolset_id: search.code
    version: 1.0.0
    summary: Syntax, symbol, reference, and local repository-history search surfaces.
    tools: [search.structural, search.symbol, search.history]
  - toolset_id: search.complete
    version: 1.0.0
    summary: Complete distinct file, text, syntax, symbol, reference, and history search surface.
    toolsets: [search.basic, search.code]
  - toolset_id: execution.process
    version: 1.0.0
    summary: Direct process execution without shell interpretation.
    tools: [core.process.exec]
  - toolset_id: execution.shell
    version: 1.0.0
    summary: Full Bash semantics under a versioned execution profile.
    tools: [core.shell.run]
  - toolset_id: execution.local
    version: 1.0.0
    summary: Direct process and Bash execution selected by required semantics.
    tools: [core.process.exec, core.shell.run]
  - toolset_id: git.local
    version: 1.0.0
    summary: Separately governed local Git staging and commit effects.
    tools: [git.stage, git.commit]
  - toolset_id: git.remote
    version: 1.0.0
    summary: Separately governed push modes with verified remote settlement.
    tools: [git.push, git.force_with_lease, git.force_push]
  - toolset_id: git.complete
    version: 1.0.0
    summary: Complete typed Git effect surface.
    toolsets: [git.local, git.remote]
  - toolset_id: web.discovery
    version: 1.0.0
    summary: Search and bounded link mapping without hidden provider selection.
    tools: [web.search, web.map]
  - toolset_id: web.retrieval
    version: 1.0.0
    summary: Typed retrieval, HTTP requests, extraction, and bounded crawl.
    tools: [web.fetch, web.request, web.extract, web.crawl]
  - toolset_id: web.complete
    version: 1.0.0
    summary: Complete typed Web capability surface.
    toolsets: [web.discovery, web.retrieval]
  - toolset_id: browser.complete
    version: 1.0.0
    summary: Governed Browser session, observation, action, diagnosis, and closure surface.
    tools: [browser.open, browser.observe, browser.act, browser.diagnostics, browser.close]
